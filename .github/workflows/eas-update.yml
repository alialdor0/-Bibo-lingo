خطأ المسافة البادئة (Indentation) في ملفات YAML. السطر الرابع يقع تحت on: بشكل خاطئ بينما يجب أن يكون في بداية الملف أو داخل مستوى صحيح.
قم بتعديل القسم الأول من الملف ليكون هكذا:
name: EAS Update

on:
  push:
    branches:
      - main

تأكد من أن السطر الأول name: EAS Update يبدأ من أقصى اليسار بدون أي مسافات بادئة، وأن on: يبدأ أيضاً من أقصى اليسار.
